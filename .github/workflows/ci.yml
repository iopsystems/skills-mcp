name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # The job runs in ~41s. Ten minutes is far above any honest run and far
    # below the six-hour default, which is what let a hung apt install stall a
    # release for fifteen minutes before anyone noticed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      # `jq` ships with the runner image; installing it cost a slot in a
      # dependency resolution that already dominates this job. Graphviz is the
      # only real dependency, and `--no-install-recommends` keeps it to what
      # `dot -Tsvg` needs rather than the full documentation-tooling set.
      # `scripts/mcp-smoke.sh` still checks for jq at run time, so a runner
      # image that drops it fails loudly rather than mysteriously.
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Check rendered diagrams
        run: ./scripts/render-diagrams.sh --check

      - name: MCP smoke test
        run: ./scripts/mcp-smoke.sh

      - name: Review bridge test
        run: ./scripts/review-bridge-test.sh

      # The release profile compiles from scratch rather than reusing the debug
      # artifacts above, which made this the longest step in the job once the
      # apt install was cut. `release.yml` builds all four target triples on a
      # version tag, so this exists to catch a release-only break earlier than
      # that -- worth a run on `main`, not worth it on every push to a branch.
      # The gap it accepts: such a break surfaces after merge rather than on the
      # pull request that caused it.
      - name: cargo build --release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --release --locked
