name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tagged commit must contain this workflow, so merge it to the default
# branch first. `workflow_dispatch` can rebuild assets for an existing tag.
#
# Publishing the release is not the last step: the final job asks the Homebrew
# tap to bump its formula, using `TAP_DISPATCH_TOKEN`, a token with write access
# to iopsystems/homebrew-iop and to nothing here. If that job is red, check
# whether the token expired.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A hung apt install on the aarch64 runner sat on the default six-hour
    # timeout during v0.4.2 while the same step took 14s on v0.3.0 and 26s on
    # the retry. Ten minutes is roughly four times the slowest honest build,
    # so a stall fails fast enough to retry inside a release.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            # libc6-dev-arm64-cross carries the cross libc headers. It is a
            # Recommends of the compiler package, so it arrived for free until
            # --no-install-recommends stopped pulling recommends, and the C in
            # libsqlite3-sys then failed on a missing bits/libc-header-start.h.
            # Named explicitly: a build dependency that only a default supplies
            # is a dependency nobody declared.
            apt: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt }}
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          bin="skills-mcp"
          dist="${bin}-${{ matrix.target }}"
          tar -czf "${dist}.tar.gz" -C "target/${{ matrix.target }}/release" "$bin"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          else
            shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skills-mcp-${{ matrix.target }}
          path: |
            skills-mcp-${{ matrix.target }}.tar.gz
            skills-mcp-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: skills-mcp ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  notify-tap:
    name: notify homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # This job holds no permissions on this repository. It reaches another one,
    # with a token stored here.
    permissions: {}
    steps:
      # The tap also checks daily on a cron. That cron is the backstop: if this
      # job fails, or the token expires, the release still reaches users within
      # a day, which is why a failure here is worth marking red rather than
      # worth retrying in place.
      - name: Ask the tap to bump the formula
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TAP_DISPATCH_TOKEN is unset. The release is published; the tap" >&2
            echo "will pick it up on its daily cron instead of within the minute." >&2
            exit 1
          fi
          # The tag travels in the payload so the tap never has to ask which
          # release this was. Asking would race the releases API, which has just
          # been written to by the job above.
          jq -n --arg tag "$TAG" \
            '{event_type: "skills-mcp-released", client_payload: {tag: $tag}}' \
            | gh api repos/iopsystems/homebrew-iop/dispatches --input -
